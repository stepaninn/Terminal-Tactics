name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build catch2 libncurses-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  multithreaded-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build catch2 libncurses-dev libtbb-dev

      - name: Configure
        run: cmake -S . -B build-mt -G Ninja -DCMAKE_BUILD_TYPE=Release -DTERMINAL_TACTICS_BUILD_MT=ON

      - name: Build
        run: cmake --build build-mt --parallel

      - name: Test
        run: ctest --test-dir build-mt --output-on-failure

  docker-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run containerized tests
        run: docker compose run --build --rm tests
